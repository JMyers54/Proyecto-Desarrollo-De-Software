<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <nav>
            <h1>Gestión de Empleados</h1>
            <a href="/admin" class="btn-volver">Volver al panel</a>
        </nav>
    </header>
<div class="inv-page">


    <div class="stats">
        <div class="stat">
            <div class="stat-label">Total Empleados</div>
            <div class="stat-val" id="s-total">—</div>
        </div>
    </div>

    <div class="toolbar">
        <input type="text" id="search" placeholder="Buscar por cédula, nombre, apellido…" oninput="renderTable()">
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th class="col-cedula">Cédula</th>
                    <th class="col-nombre">Nombre</th>
                    <th class="col-apellido">Apellido</th>
                    <th class="col-telefono">Teléfono</th>
                    <th class="col-email">Email</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr class="empty-row"><td colspan="5">Cargando…</td></tr>
            </tbody>
        </table>
    </div>

    <div class="detail-panel" id="detail-panel">
        <div class="detail-header">
            <h3 id="detail-title">Detalle</h3>
            <button class="btn-icon" onclick="closeDetail()" title="Cerrar">
                <i class="ti ti-x"></i>
            </button>
        </div>
        
        <div class="detail-grid" id="detail-grid"></div>
        
        <div id="asesor-stats-box" style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
            <h4 style="color: #ffffff; margin-bottom: 12px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;">Rendimiento de Asesoría</h4>
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
                <div style="background-color: #212121; padding: 12px; border-radius: 6px; text-align: center; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);">
                    <div style="font-size: 11px; color: #8c8c8e; text-transform: uppercase;">Carros Asesorados</div>
                    <div id="asesor-carros" style="font-size: 20px; font-weight: bold; color: #597ef7; margin-top: 4px;">0</div>
                </div>
            </div>
        </div>
    </div>

</div><div id="toast"></div>

<script>
    let empleados  = [];
    let selectedId = null;

    document.addEventListener("DOMContentLoaded", loadEmpleados);

    /* ── API ── */
    async function loadEmpleados() {
        try {
            const res = await fetch("/api/empleados");
            if (!res.ok) throw new Error("Error al cargar");
            empleados = await res.json();
            renderTable();
        } catch (e) {
            toast("Error cargando datos: " + e.message, true);
        }
    }

    /* ── FILTROS ── */
    function getFiltered() {
        const q = document.getElementById("search").value.toLowerCase();
        return empleados.filter(e => {
            return !q || 
                    e.cedula?.toLowerCase().includes(q) || 
                    e.nombre?.toLowerCase().includes(q) || 
                    e.apellido?.toLowerCase().includes(q) || 
                    e.email?.toLowerCase().includes(q);
        });
    }

    /* ── STATS ── */
    function updateStats() {
        document.getElementById("s-total").textContent = empleados.length;
    }

    /* ── TABLA (Corregido el colspan a 6) ── */
    function renderTable() {
        updateStats();
        const list  = getFiltered();
        const tbody = document.getElementById("tbody");
        if (!list.length) {
            tbody.innerHTML = `<tr class="empty-row"><td colspan="6">Sin resultados</td></tr>`;
            return;
        }
        tbody.innerHTML = list.map(e => `
            <tr data-id="${e.id}" class="${selectedId === e.id ? 'selected' : ''}" onclick="showDetail(${e.id})">
                <td>${e.cedula  || "—"}</td>
                <td>${e.nombre  || "—"}</td>
                <td>${e.apellido || "—"}</td>
                <td>${e.telefono || "—"}</td>
                <td>${e.email || "—"}</td>
            </tr>`).join("");
    }

    /* ── DETALLE MODIFICADO ── */
    function showDetail(id) {
        const e = empleados.find(x => x.id === id);
        if (!e) return;
        selectedId = id;
        renderTable();
        
        document.getElementById("detail-title").textContent = `${e.nombre} ${e.apellido}`;
        document.getElementById("detail-grid").innerHTML = `
            <div class="detail-item"><label>Cédula</label><span>${e.cedula || "—"}</span></div>
            <div class="detail-item"><label>Nombre</label><span>${e.nombre || "—"}</span></div>
            <div class="detail-item"><label>Apellido</label><span>${e.apellido || "—"}</span></div>
            <div class="detail-item"><label>Teléfono</label><span>${e.telefono || "—"}</span></div>
            <div class="detail-item"><label>Email</label><span>${e.email || "—"}</span></div>`;
        
        // Inyectar los valores del historial que vienen en el objeto JSON del empleado
        fetch(`/api/empleado/estadisticas/${id}`)
    .then(r => r.json())
    .then(stats => {
        document.getElementById("asesor-carros").textContent = stats.total_carros || 0;
    });
        
        document.getElementById("detail-panel").classList.add("open");
    }

    function closeDetail() {
        selectedId = null;
        document.getElementById("detail-panel").classList.remove("open");
        renderTable();
    }

    /* ── TOAST ── */
    let toastTimer;
    function toast(msg, isError = false) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.style.background = isError ? "#a32d2d" : "#1a1a18";
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
    }
</script>

</body>
</html>
