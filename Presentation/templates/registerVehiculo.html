<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Vehiculo - Alquiler de Vehículos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="registro-box-container">
        <h1>Registro de Vehículos</h1>
        
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-mensaje-box">
            <ul>
                {% for message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
        {% endwith %}

        <form method="post" action="/registro_vehiculo" enctype="multipart/form-data">
            
            <div class="formulario-grid-interno">
                
                <div class="grupo-campo">
                    <label for="Marca">Marca</label>
                    <input type="text" id="Marca" name="Marca" placeholder="Ej: Toyota" required>
                </div>

                <div class="grupo-campo">
                    <label for="Modelo">Modelo</label>
                    <input type="text" id="Modelo" name="Modelo" placeholder="Ej: Corolla" required>
                </div>

                <div class="grupo-campo">
                    <label for="Año">Año</label>
                    <input type="number" id="Año" name="Año" placeholder="2024" required>
                </div>

                <div class="grupo-campo">
                    <label for="Tipo">Tipo</label>
                    <select id="Tipo" name="Tipo" required>
                        <option value="" disabled selected hidden>Selecciona...</option>
                        <option value="Sedán">Sedán</option>
                        <option value="Camioneta 4x4">Camioneta 4x4</option>
                        <option value="Deportivo">Deportivo</option>
                        <option value="Hatchback">Hatchback</option>
                    </select>
                </div>

                <div class="grupo-campo">
                    <label for="Precio_diario">Precio / Día</label>
                    <input type="number" id="Precio_diario" name="Precio_diario" placeholder="COP" required>
                </div>

                <div class="grupo-campo">
                    <label for="Estado">Estado</label>
                    <select id="Estado" name="Estado" required>
                        <option value="Disponible">Disponible</option>
                        <option value="Mantenimiento">Mantenimiento</option>
                    </select>
                </div>

                <div class="grupo-campo ancho-completo">
                    <label for="Imagen">Imagen del Vehículo</label>
                    <input type="file" id="Imagen" name="Imagen" accept="image/*" required>
                </div>

                <button type="submit" class="btn-registrar-box ancho-completo">Registrar Vehículo</button>
            </div>

        </form>
        
        <div class="link-retorno-box">
            <a href="/admin">Volver al Panel</a>
        </div>
    </div>
</body>

</html>
