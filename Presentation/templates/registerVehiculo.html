<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Vehiculo - Alquiler de Vehículos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #262627;
            color: white;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #3a3a3c;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            width: 400px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
        }

        input {
            padding: 8px;
            margin-bottom: 15px;
            border: none;
            border-radius: 4px;
        }

        button {
            padding: 10px;
            background-color: #848489;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        button:hover {
            background-color: #6a6a6d;
        }

        .back-link {
            text-align: center;
        }

        .back-link a {
            color: #848489;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .flash {
            color: #ffcccc;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Registro de Vehiculos</h1>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash">
            <ul>
                {% for message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
        {% endwith %}
        <form method="post" action="/registrar_vehiculo">
            <label for="IdVehiculo">ID Vehículo:</label>
            <input type="text" id="IdVehiculo" name="IdVehiculo" required>

            <label for="Marca">Marca:</label>
            <input type="text" id="Marca" name="Marca" required>

            <label for="Modelo">Modelo:</label>
            <input type="text" id="Modelo" name="Modelo" required>

            <label for="Año">Año:</label>
            <input type="text" id="Año" name="Año" required>

            <label for="Tipo">Tipo:</label>
            <input type="text" id="Tipo" name="Tipo" required>

            <label for="Precio_diario">Precio por Día:</label>
            <input type="text" id="Precio_diario" name="Precio_diario" required>

            <label for="Estado">Estado:</label>
            <input type="text" id="Estado" name="Estado" required>

            <button type="submit">Registrar</button>
        </form>
        <div class="back-link">
            <a href="/admin" class="btn-volver">Volver al Panel</a>
        </div>
    </div>
</body>

</html>
