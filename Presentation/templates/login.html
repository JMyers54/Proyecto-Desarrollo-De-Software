<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - {{ rol.capitalize() }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <header>
        <nav>
            <h1>Alquiler de Vehículos</h1>
            <a href="{{ url_for('login') }}" class="btn-volver-rol">Seleccionar Rol</a>
        </nav>
    </header>

    <main>
        <section class="login">
            <div class="container">
                <input id="signup_toggle" type="checkbox">
                <form class="form" method="POST">
                    <div class="form_front">
                        <div class="form_details">{{ rol.capitalize() }}</div>

                        {% with messages = get_flashed_messages() %}
                        {% if messages %}
                        <div class="flash-messages">
                            {% for message in messages %}
                            <p>{{ message }}</p>
                            {% endfor %}
                        </div>
                        {% endif %}
                        {% endwith %}

                        <input type="text" class="input" id="id" name="id" placeholder="ID" required>
                        <input type="password" class="input" id="contra" name="contra" placeholder="Contraseña" required>
                        <button class="btn" type="submit">Iniciar Sesión</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
