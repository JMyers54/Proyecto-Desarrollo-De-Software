<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Cliente - Alquiler de Vehículos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="registro-box-container">
        <h1>Registro de Cliente</h1>
        
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-mensaje-box">
            <ul>
                {% for message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
        {% endwith %}

        <form method="post" action="/registrar_cliente">
            
            <div class="formulario-grid-interno">
                

                <div class="grupo-campo">
                    <label for="Cedula">Cédula</label>
                    <input type="number" id="Cedula" name="Cedula" placeholder="Número de documento" required>
                </div>

                <div class="grupo-campo">
                    <label for="Nombre">Nombre</label>
                    <input type="text" id="Nombre" name="Nombre" placeholder="Tu nombre" required>
                </div>

                <div class="grupo-campo">
                    <label for="Apellido">Apellido</label>
                    <input type="text" id="Apellido" name="Apellido" placeholder="Tu apellido" required>
                </div>

                <div class="grupo-campo">
                    <label for="Telefono">Teléfono</label>
                    <input type="number" id="Telefono" name="Telefono" placeholder="Ej: 312..." required>
                </div>

                <div class="grupo-campo">
                    <label for="Email">Email</label>
                    <input type="email" id="Email" name="Email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="grupo-campo">
                    <label for="Contra">Contraseña</label>
                    <input type="password" id="Contra" name="Contra" placeholder="••••••••" required>
                </div>

                <div class="grupo-campo">
                    <label for="NumLicencia">N° Licencia</label>
                    <input type="text" id="NumLicencia" name="NumLicencia" placeholder="Cedula" required>
                </div>

                <div class="grupo-campo">
                    <label for="FechaVencimientoLicencia">Vencimiento Licencia</label>
                    <input type="date" id="FechaVencimientoLicencia" name="FechaVencimientoLicencia" min="{{ fecha_hoy }}" onkeydown="return false" required>
                </div>

                <button type="submit" class="btn-registrar-box ancho-completo">Registrar Cliente</button>
            </div>

        </form>
        
        <div class="link-retorno-box">
            <a href="/empleado">Volver al Panel</a>
        </div>
    </div>
</body>

</html>
