<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Empleado - Alquiler de Vehículos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="registro-box-container">
        <h1>Registro de Empleado</h1>
        
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-mensaje-box">
            <ul>
                {% for message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
        {% endwith %}

        <form method="post" action="/registrar_empleado">
            
            <div class="formulario-grid-interno">
                
                <div class="grupo-campo">
                    <label for="IdEmpleado">ID Empleado</label>
                    <input type="text" id="IdEmpleado" name="IdEmpleado" placeholder="Ej: EMP-202" required>
                </div>

                <div class="grupo-campo">
                    <label for="Cedula">Cédula</label>
                    <input type="text" id="Cedula" name="Cedula" placeholder="Número de documento" required>
                </div>

                <div class="grupo-campo">
                    <label for="Nombre">Nombre</label>
                    <input type="text" id="Nombre" name="Nombre" placeholder="Nombre del empleado" required>
                </div>

                <div class="grupo-campo">
                    <label for="Apellido">Apellido</label>
                    <input type="text" id="Apellido" name="Apellido" placeholder="Apellido del empleado" required>
                </div>

                <div class="grupo-campo">
                    <label for="Telefono">Teléfono</label>
                    <input type="text" id="Telefono" name="Telefono" placeholder="Ej: 300..." required>
                </div>

                <div class="grupo-campo">
                    <label for="Email">Email</label>
                    <input type="email" id="Email" name="Email" placeholder="empleado@empresa.com" required>
                </div>

                <div class="grupo-campo ancho-completo">
                    <label for="Contra">Contraseña</label>
                    <input type="password" id="Contra" name="Contra" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-registrar-box ancho-completo">Registrar Empleado</button>
            </div>

        </form>
        
        <div class="link-retorno-box">
            <a href="/admin">Volver al Panel</a>
        </div>
    </div>
</body>

</html>
